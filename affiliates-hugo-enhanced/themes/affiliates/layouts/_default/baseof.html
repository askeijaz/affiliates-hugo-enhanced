<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ .Site.Params.description }}">
    <meta name="author" content="{{ .Site.Params.author }}">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom styles -->
    <link href="{{ "css/main.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/contact-form.css" | relURL }}" rel="stylesheet">
    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <!-- Favicon -->
    <link rel="icon" href="{{ .Site.Params.favicon | relURL }}">
    <!-- Netlify Identity for CMS -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <!-- Navigation -->
    {{ partial "header.html" . }}
    
    <!-- Page Content -->
    <div class="container">
        {{ block "main" . }}{{ end }}
    </div>
    
    <!-- Footer -->
    {{ partial "footer.html" . }}
    
    <!-- Bootstrap 5 JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery (still needed for some plugins) -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Custom scripts -->
    <script src="{{ "js/main.js" | relURL }}"></script>
    <script src="{{ "js/contact-form.js" | relURL }}"></script>
    
    <!-- Tawk.to Chat Widget -->
    {{ partial "tawk-to.html" . }}
</body>
</html>
